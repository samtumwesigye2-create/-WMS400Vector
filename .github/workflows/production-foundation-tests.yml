name: Production Foundation Tests

on:
  push:
    branches:
      - feature/production-foundation-p1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vector_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vector_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
