name: tests
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q
      - run: PYTHONPATH=. python -m py_compile app.py material_master.py manufacturing_planning.py inbound_workflow.py inventory_control.py goods_movement.py
