<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-VECTOR</title><style>
:root{--bg:#f3f5f8;--panel:white;--ink:#172236;--muted:#66748a;--line:#dce3ec;--accent:#2e50e9;--nav:#101b2e}*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 17px;border-radius:10px;min-height:44px}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--accent);color:white;border-color:var(--accent)}aside{position:fixed;inset:0 auto 0 0;width:255px;background:var(--nav);color:white;padding:27px 20px;overflow:auto}aside h2{margin:0 0 6px;font-size:24px}aside p{font-size:13px;color:#a9b7cb;margin-bottom:28px}nav{display:grid;gap:7px}nav button{background:transparent;color:#c5d1e2;border-color:transparent;text-align:left}nav button.active{background:#ffffff18;color:white;border-color:#ffffff20}main{margin-left:255px;padding:30px 34px;max-width:1800px}header{display:flex;justify-content:space-between;gap:16px;align-items:start}h1{font-size:32px;letter-spacing:-1px;margin:0}h3{margin-top:0}p{line-height:1.5}.muted{color:var(--muted)}.badge{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:30px;white-space:nowrap;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px}.stat b{display:block;font-size:28px;margin-top:9px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}label{display:grid;gap:8px;font-size:14px;font-weight:600}input,select,textarea{padding:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:100%;min-width:0}textarea{min-height:100px}.wide{grid-column:1/-1}.leg{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.error{color:#b42318}.success{color:#087443}#message{padding:12px 0;min-height:45px}.scroll{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;max-width:350px;overflow-wrap:anywhere}th{color:var(--muted);font-size:12px;text-transform:uppercase;position:sticky;top:0;background:var(--panel)}td details{min-width:160px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace}.empty{padding:25px;color:var(--muted)}#search{max-width:340px}.notice{font-size:13px}.result{display:grid;gap:12px}dl{display:grid;grid-template-columns:170px 1fr;margin:0;gap:12px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.terminal{--bg:#03150d;--panel:#071f14;--ink:#77f6a4;--muted:#64a77e;--line:#1f5839;--accent:#137043;--nav:#021108;font-family:ui-monospace,SFMono-Regular,monospace}.terminal aside,.terminal .card,.terminal button,.terminal input,.terminal select{border-radius:4px}.terminal h1{font-size:29px}.terminal nav button.active{color:#86ffb2}.terminal .primary{color:#c2ffd9}.terminal .success{color:#77f6a4}.terminal .error{color:#ff9393}.terminal aside{border-right:1px solid var(--line)}nav>div{font-size:11px;letter-spacing:.12em;color:#8fa1b7;margin:18px 8px 4px;font-weight:800}
@media(max-width:850px){aside{position:relative;width:auto;padding:18px}aside p{margin:4px 0 14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:22px 16px}h1{font-size:27px}.fields{grid-template-columns:1fr}.badge{white-space:normal}header{flex-wrap:wrap}dl{grid-template-columns:1fr}.card{padding:18px}.stats .stat{min-width:125px}}
</style></head><body><aside><h2>UNG-VECTOR</h2><p id="subtitle"></p><nav id="nav"></nav></aside><main><header><div><h1 id="heading"></h1><p id="description" class="muted"></p></div><span class="badge" id="health">Checking service…</span></header><div id="auth"></div><div class="toolbar"><button id="nextTaskBtn" class="primary">Next Task</button><button id="todayBtn">Today</button><input id="quickFind" placeholder="Scan or enter SKU, order, shipment…" aria-label="Quick find"><button id="quickFindBtn">Find</button><button id="refresh">Refresh</button><button id="signout" hidden>Sign out</button></div><div class="toolbar"><input id="search" placeholder="Filter loaded records" aria-label="Filter loaded records"></div><div id="message" role="status" aria-live="polite"></div><div class="toolbar"><button id="openShipping" class="primary">Open Shipping Console</button></div><div class="stats" id="stats"></div><div class="card" id="content"></div><p class="muted notice" id="notice"></p></main><script>
const C={"title":"UNG-VECTOR","subtitle":"Warehouse & Logistics","description":"Receive, move, fulfill, ship and track inventory without digging through technical menus.","health":"/ready","summary":"/v1/summary","auth":true,"terminal":false,"resources":[["Inventory","/v1/inventory"],["Locations","/v1/locations"],["Shipments","/v1/transport/shipments"],["Returns","/v1/warehouse-control/returns"],["Reorder Alerts","/v1/analytics/reorder-alerts"],["Warehouse KPIs","/v1/kpis/snapshot"],["Logistics KPIs","/v1/transport/kpis"]],"actions":[{"title":"Receive Stock","path":"/v1/movements","fields":[{"name":"sku","label":"Item / SKU","kind":"text","options":null,"optional":false},{"name":"quantity","label":"Quantity received","kind":"integer","options":null,"optional":false},{"name":"to_location","label":"Put-away location","kind":"text","options":null,"optional":false},{"name":"reference","label":"PO / receiving reference","kind":"text","options":null,"optional":true},{"name":"movement_type","label":"Movement type","kind":"hidden","options":["receive"],"optional":false}],"method":"POST"},{"title":"Move Stock","path":"/v1/movements","fields":[{"name":"sku","label":"Item / SKU","kind":"text","options":null,"optional":false},{"name":"quantity","label":"Quantity","kind":"integer","options":null,"optional":false},{"name":"from_location","label":"From","kind":"text","options":null,"optional":false},{"name":"to_location","label":"To","kind":"text","options":null,"optional":false},{"name":"reference","label":"Reference","kind":"text","options":null,"optional":true},{"name":"movement_type","label":"Movement type","kind":"hidden","options":["transfer"],"optional":false}],"method":"POST"},{"title":"Dispatch Stock","path":"/v1/movements","fields":[{"name":"sku","label":"Item / SKU","kind":"text","options":null,"optional":false},{"name":"quantity","label":"Quantity","kind":"integer","options":null,"optional":false},{"name":"from_location","label":"Dispatch from","kind":"text","options":null,"optional":false},{"name":"reference","label":"Order / shipment reference","kind":"text","options":null,"optional":true},{"name":"movement_type","label":"Movement type","kind":"hidden","options":["dispatch"],"optional":false}],"method":"POST"},{"title":"Create Shipment","path":"/v1/transport/shipments","fields":[{"name":"reference","label":"Shipment reference","kind":"text","options":null,"optional":false},{"name":"origin","label":"Origin","kind":"text","options":null,"optional":false},{"name":"destination","label":"Destination","kind":"text","options":null,"optional":false},{"name":"total_weight_kg","label":"Weight (kg)","kind":"number","options":null,"optional":false}],"method":"POST"},{"title":"Track Shipment","path":"/v1/transport/shipments/{shipment_id}/track","fields":[{"name":"shipment_id","label":"Shipment ID","kind":"text","options":null,"optional":false},{"name":"event","label":"Tracking update","kind":"text","options":null,"optional":false}],"method":"POST"},{"title":"Find Fulfillment","path":"/v1/inbound/fulfillment/{reference}","fields":[{"name":"reference","label":"Order / fulfillment reference","kind":"text","options":null,"optional":false}],"method":"GET"},{"title":"Complete Next Fulfillment Step","path":"/v1/inbound/fulfillment/{reference}/next","fields":[{"name":"reference","label":"Order / fulfillment reference","kind":"text","options":null,"optional":false}],"method":"POST"}],"notice":"Simple warehouse mode: common work first. Advanced functions remain available through admin/API tools."}
const $=id=>document.getElementById(id);let token='',selected=0,records=[],busy=false;
if(C.terminal)document.body.classList.add('terminal');$('subtitle').textContent=C.subtitle;$('heading').textContent=C.subtitle;$('description').textContent=C.description;$('notice').textContent=C.notice;
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function msg(text,error=false){$('message').textContent=text;$('message').className=error?'error':'success';if(text)$('message').scrollIntoView({behavior:'smooth',block:'nearest'})}
function friendlyError(detail,status){const raw=typeof detail==='string'?detail:JSON.stringify(detail||'');const key=raw.replace(/^"|"$/g,'');const map={insufficient_inventory:'Not enough stock is available for this action.',insufficient_available_inventory:'Not enough available stock. Some units may be reserved, quarantined or damaged.',receipt_exceeds_order_quantity:'The received quantity is greater than the quantity still expected on this order.',expected_receipt_not_found:'This receiving reference was not found.',fulfillment_not_found:'No fulfillment work was found for that reference.',prior_task_not_completed:'Finish the previous fulfillment step first.',task_already_completed:'This fulfillment step is already complete.',shipment_not_found:'This shipment could not be found.',shipment_not_ready:'This shipment is not ready to dispatch yet.',shipment_not_optimized:'Optimize the shipment before tendering it.',transport_lane_not_found:'No active transport lane matches this shipment.',carrier_capacity_unavailable:'No active carrier currently has enough capacity for this shipment.',inventory_not_found:'No inventory record was found for that item and location.',quantity_must_be_positive:'Enter a quantity greater than zero.',to_location_required:'Choose a receiving location.',from_location_required:'Choose the source location.',distinct_from_and_to_locations_required:'Choose different source and destination locations.',JANUS_token_invalid_or_expired:'Your session expired. Sign in again.'};if(map[key])return map[key];if(status===401)return 'Your session expired or you are not signed in.';if(status===403)return 'You do not have permission to perform this operation.';if(status>=500)return 'The service could not complete that action right now. Try again.';return raw.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())||('Request failed '+status)}
async function api(path,method='GET',body){const headers={};if(token)headers.Authorization='Bearer '+token;if(body!==undefined)headers['Content-Type']='application/json';const r=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let data;try{data=await r.json()}catch{throw Error('The service returned an unreadable response.')}if(!r.ok){if(r.status===401&&path!='/ui/session')clearSession();throw Error(friendlyError(data.detail,r.status))}return data}
function clearSession(){token='';records=[];$('stats').replaceChildren();$('content').replaceChildren(el('p','Sign in to load protected records.'));$('signout').hidden=true;showLogin()}
function showLogin(){if(!C.auth)return;$('auth').replaceChildren();const box=el('section');box.className='card';box.append(el('h3','Sign in with UNG Identity'));const form=el('form');form.className='fields';for(const [name,label,type] of [['email','Email','email'],['password','Password','password']]){const l=el('label',label),input=el('input');input.name=name;input.type=type;input.required=true;input.autocomplete=type==='password'?'current-password':'username';l.append(input);form.append(l)}const b=el('button','Sign in');b.className='primary';form.append(b);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const body=Object.fromEntries(new FormData(form));const data=await api('/ui/session','POST',body);token=data.access_token;form.reset();$('auth').replaceChildren(el('p','Signed in · '+(data.identity?.display_name||'UNG Identity')));$('signout').hidden=false;msg('Identity verified. Loading live records.');await load()}catch(error){msg(error.message,true)}finally{b.disabled=false}};box.append(form);$('auth').append(box)}
function cell(value){if(value===null||value===undefined)return el('span','—');if(typeof value==='object'){const d=el('details');d.append(el('summary',Array.isArray(value)?value.length+' entries':'Details'));d.append(el('pre',JSON.stringify(value,null,2)));return d}return el('span',String(value))}
function renderRecords(data){records=Array.isArray(data)?data:Array.isArray(data.results)?data.results:Array.isArray(data.alternatives)?data.alternatives:null;if(!records){renderObject(data);return}drawTable()}
function drawTable(){const panel=$('content');panel.replaceChildren(el('h3',C.resources[selected]?.[0]||'Results'));const query=$('search').value.toLowerCase();const rows=records.filter(row=>JSON.stringify(row).toLowerCase().includes(query));if(!rows.length){panel.append(el('p',query?'No matching records.':'No records returned.'));return}const wrap=el('div');wrap.className='scroll';const table=el('table'),head=el('thead'),tr=el('tr');const keys=[...new Set(rows.flatMap(row=>Object.keys(row)))].filter(k=>!['envelope','password_hash','value','token','access_token'].includes(k));keys.forEach(k=>tr.append(el('th',k.replaceAll('_',' '))));head.append(tr);table.append(head);const tbody=el('tbody');for(const row of rows){const line=el('tr');for(const key of keys){const td=el('td');td.append(cell(row[key]));line.append(td)}tbody.append(line)}table.append(tbody);wrap.append(table);panel.append(wrap);panel.append(el('p',rows.length+' records · loaded '+new Date().toLocaleTimeString()))}
function renderObject(data){records=null;const box=$('content');box.replaceChildren(el('h3','Operation result'));const dl=el('dl');for(const [key,value] of Object.entries(data)){if(['token','access_token','envelope','password_hash'].includes(key))continue;dl.append(el('dt',key.replaceAll('_',' ')));const dd=el('dd');if(key==='value'){const mask=el('span','••••••••'),reveal=el('button','Reveal');let shown=false;reveal.onclick=()=>{shown=!shown;mask.textContent=shown?String(value):'••••••••';reveal.textContent=shown?'Hide':'Reveal'};dd.append(mask,el('br'),reveal)}else dd.append(cell(value));dl.append(dd)}box.append(dl)}
async function health(){try{const d=await api(C.health);const ok=d.ready===true||d.status==='ready'||d.status==='ok';$('health').textContent=ok?'● Service online'+(d.database==='connected'?' · Database connected':''):'● Service degraded';}catch(e){$('health').textContent='● Service unavailable';msg(e.message,true)}}
async function load(){if(busy)return;if(C.auth&&!token){msg('Sign in to load live data.');return}busy=true;$('refresh').disabled=true;try{const resource=C.resources[selected];if(resource){renderRecords(await api(resource[1]));msg('Live '+resource[0].toLowerCase()+' loaded.')}if(C.summary){const d=await api(C.summary);$('stats').replaceChildren();for(const key of ['distinct_skus','units_on_hand','movements']){const n=el('div');n.className='card stat';n.append(el('span',key.replaceAll('_',' ')),el('b',d[key]??'—'));$('stats').append(n)}}}catch(e){msg(e.message,true)}finally{busy=false;$('refresh').disabled=false}}
function field(spec,parent){const l=el('label',spec.label);if(spec.kind==='hidden'){const input=el('input');input.type='hidden';input.name=spec.name;input.value=spec.options[0];parent.append(input);return}if(spec.kind==='legs'){l.className='wide';const holder=el('div');let count=0;function add(){const group=el('div');group.className='leg';group.dataset.leg='true';group.append(el('h4','Transport leg '+(++count)));const grid=el('div');grid.className='fields';for(const s of [{"name": "mode", "label": "Transport mode", "kind": "select", "options": ["road", "rail", "ocean", "air"], "optional": false}, {"name": "origin", "label": "Origin", "kind": "text", "options": null, "optional": false}, {"name": "destination", "label": "Destination", "kind": "text", "options": null, "optional": false}, {"name": "distance_km", "label": "Distance (km)", "kind": "number", "options": null, "optional": false}, {"name": "cargo_tons", "label": "Cargo (tons)", "kind": "number", "options": null, "optional": false}])field(s,grid);const remove=el('button','Remove leg');remove.type='button';remove.onclick=()=>group.remove();group.append(grid,remove);holder.append(group)}add();const b=el('button','+ Add transport leg');b.type='button';b.onclick=add;l.append(holder,b);parent.append(l);return}let input=el(spec.kind==='select'?'select':spec.kind==='secret'?'textarea':'input');if(spec.kind==='select')for(const v of spec.options){const o=el('option',v);o.value=v;input.append(o)}else if(spec.kind!=='secret'){input.type=['number','integer'].includes(spec.kind)?'number':'text';if(['number','integer'].includes(spec.kind))input.step=spec.kind==='integer'?'1':'any'}input.name=spec.name;input.required=!spec.optional;input.dataset.kind=spec.kind;input.autocomplete='off';if(spec.kind==='secret'){input.spellcheck=false;l.className='wide'}l.append(input);parent.append(l)}
function extract(root){const data={};for(const input of root.querySelectorAll('input,select,textarea')){if(input.closest('[data-leg]')&&root.tagName==='FORM')continue;if(input.value==='')continue;data[input.name]=['number','integer'].includes(input.dataset.kind)?Number(input.value):input.value}return data}
function showAction(a){selected=-1;records=null;$('search').value='';const box=$('content');box.replaceChildren(el('h3',a.title));const form=el('form');form.className='fields';a.fields.forEach(s=>field(s,form));const submit=el('button',a.title);submit.className='primary wide';form.append(submit);form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;try{let body=extract(form);const legs=[...form.querySelectorAll('[data-leg]')];if(a.fields.some(s=>s.kind==='legs')){if(!legs.length)throw Error('Add at least one transport leg');body.legs=legs.map(extract)}let path=a.path.replace(/\{(\w+)\}/g,(_,key)=>{if(!body[key])throw Error('Missing '+key);const value=encodeURIComponent(body[key]);delete body[key];return value});const data=await api(path,a.method,a.method==='GET'?undefined:body);form.querySelectorAll('textarea').forEach(x=>x.value='');renderRecords(data);msg(a.title+' completed.')}catch(error){msg(error.message,true)}finally{submit.disabled=false}};box.append(form);msg('Complete the fields and submit to run this operation.')}
$('nav').append(el('div','RECORDS'));for(let i=0;i<C.resources.length;i++){const b=el('button',C.resources[i][0]);b.onclick=()=>{selected=i;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()};if(i===0)b.classList.add('active');$('nav').append(b)}$('nav').append(el('div','DO'));for(const a of C.actions){const b=el('button',a.title);b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showAction(a)};$('nav').append(b)}
$('openShipping').onclick=()=>{window.location.href='https://ugaship-production.up.railway.app/console'};async function showNextTask(){if(C.auth&&!token){msg('Sign in to load your next task.');return}try{const d=await api('/v1/simple/next-task');selected=-1;records=null;const box=$('content');box.replaceChildren(el('h3','Next Task'));const card=el('section');card.className='card';card.append(el('h2',d.title||'Next Task'));card.append(el('p',d.summary||''));if(d.reference)card.append(el('p','Reference: '+d.reference));const hint=el('p',d.suggested_action||'');hint.className='muted';card.append(hint);if(d.record){const details=el('details');details.append(el('summary','Details'));details.append(el('pre',JSON.stringify(d.record,null,2)));card.append(details)}box.append(card);msg(d.kind==='none'?'Nothing is waiting right now.':'Your highest-priority warehouse task is ready.')}catch(e){msg(e.message,true)}}async function showToday(){if(C.auth&&!token){msg('Sign in to load today\'s work.');return}try{const d=await api('/v1/simple/today');selected=-1;records=null;const box=$('content');box.replaceChildren(el('h3','Today'));const order=[['Receipts due','receipts_due'],['Fulfillment tasks','fulfillment_tasks'],['Open shipments','shipments_open'],['Exceptions','transport_exceptions'],['Low stock','low_stock']];for(const [label,key] of order){const section=el('section');section.className='card';section.append(el('h3',label+' · '+(d.counts?.[key]??0)));const rows=d[key]||[];if(!rows.length)section.append(el('p','Nothing waiting.'));else{const wrap=el('div');wrap.className='scroll';const table=el('table');const keys=Object.keys(rows[0]);const th=el('tr');keys.forEach(k=>th.append(el('th',k.replaceAll('_',' '))));const thead=el('thead');thead.append(th);table.append(thead);const tb=el('tbody');for(const row of rows){const tr=el('tr');keys.forEach(k=>{const td=el('td');td.append(cell(row[k]));tr.append(td)});tb.append(tr)}table.append(tb);wrap.append(table);section.append(wrap)}box.append(section)}msg('Today\'s warehouse work loaded.')}catch(e){msg(e.message,true)}}async function quickFind(){const q=$('quickFind').value.trim();if(!q){msg('Enter or scan an SKU, order, shipment or location.',true);return}try{const d=await api('/v1/simple/find?q='+encodeURIComponent(q));selected=-1;records=null;const box=$('content');box.replaceChildren(el('h3','Find · '+q));for(const key of ['inventory','receipts','fulfillment','shipments']){const rows=d[key]||[];if(!rows.length)continue;const section=el('section');section.className='card';section.append(el('h3',key[0].toUpperCase()+key.slice(1)));const wrap=el('div');wrap.className='scroll';const table=el('table');const keys=Object.keys(rows[0]);const hr=el('tr');keys.forEach(k=>hr.append(el('th',k.replaceAll('_',' '))));const hd=el('thead');hd.append(hr);table.append(hd);const body=el('tbody');for(const row of rows){const tr=el('tr');keys.forEach(k=>{const td=el('td');td.append(cell(row[k]));tr.append(td)});body.append(tr)}table.append(body);wrap.append(table);section.append(wrap);box.append(section)}if(!['inventory','receipts','fulfillment','shipments'].some(k=>(d[k]||[]).length))box.append(el('p','No matching warehouse or shipping records.'));msg('Search complete.')}catch(e){msg(e.message,true)}}$('nextTaskBtn').onclick=showNextTask;$('todayBtn').onclick=showToday;$('quickFindBtn').onclick=quickFind;$('quickFind').addEventListener('keydown',e=>{if(e.key==='Enter')quickFind()});$('refresh').onclick=()=>{health();load()};$('search').oninput=()=>{if(records)drawTable()};$('signout').onclick=async()=>{try{await api('/ui/session','DELETE');clearSession();msg('Signed out.')}catch(e){clearSession();msg('Local session cleared; remote revocation failed: '+e.message,true)}};
document.addEventListener('keydown',e=>{if(!C.terminal)return;if(e.key==='F5'){e.preventDefault();health();load()}if(e.key==='F3'||e.key==='F12'){e.preventDefault();selected=0;load()}});health();showLogin();if(!C.auth)load();else $('content').textContent='Sign in to load protected records.';
</script></body></html>
